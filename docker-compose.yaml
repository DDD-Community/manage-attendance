services:
  # db:
  #   image: postgres:15
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_USER: django
  #     POSTGRES_PASSWORD: securepassword
  #     POSTGRES_DB: djangodb

  ddd_app_server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - ./ddd_app_server:/app
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    environment:
      - DJANGO_SETTINGS_MODULE=ddd_app_server.settings.local
      # - DJANGO_SETTINGS_MODULE=ddd_app_server.settings.production
    # expose:
    #   - "8000"
    # ports:
    #   - "8000:8000"
    env_file:
      - .env
    # depends_on:
    #   - db

  nginx:
    image: nginx:stable-alpine
    # ports:
    #   - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      # - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/nginx/conf.d/ddd-app-server.conf:/etc/nginx/conf.d/ddd-app-server.conf
      # - ./config/nginx/conf.d/ddd-app-server-dev.conf:/etc/nginx/conf.d/ddd-app-server-dev.conf
      - ./.ssl:/etc/ssl
      - static_volume:/tmp/static
      - media_volume:/tmp/media
    # depends_on:
    #   - ddd_app_server
    networks:
      - proxy-public
      - default
    labels:
      - "traefik.enable=true"
      
      # --- 라우팅 설정 (도메인) ---
      - "traefik.http.routers.myweb.rule=Host(`home.ufxpri.dev`)"
      - "traefik.http.routers.myweb.entrypoints=websecure"
      
      # --- SSL 인증서 사용 선언 ---
      - "traefik.http.routers.myweb.tls.certresolver=myresolver"
      
      # --- 포트 연결 ---
      - "traefik.http.services.myweb.loadbalancer.server.port=80"
    

volumes:
  static_volume:
  media_volume:
  postgres_data:


networks:
  proxy-public:
    external: true